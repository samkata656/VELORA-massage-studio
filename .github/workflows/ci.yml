name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# A new push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"
  NEXT_TELEMETRY_DISABLED: "1"
  # prisma generate / next build never connect; a placeholder is enough outside the database jobs.
  DATABASE_URL: postgresql://build:build@localhost:5432/build

jobs:
  checks:
    name: Lint, type check & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate Prisma client and route types
        run: |
          npx prisma generate
          npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Migrations & seed (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: velora
          POSTGRES_PASSWORD: velora_ci
          POSTGRES_DB: velora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U velora -d velora"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://velora:velora_ci@localhost:5432/velora?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
      - name: Schema matches the migrations (no un-migrated changes)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed
        run: npx prisma db seed
      - name: Seed again (must be idempotent)
        run: npx prisma db seed

  build:
    name: Production build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: velora
          POSTGRES_PASSWORD: velora_ci
          POSTGRES_DB: velora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U velora -d velora"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://velora:velora_ci@localhost:5432/velora?schema=public
      APP_URL: http://localhost:3000
      # Throwaway key for the smoke test only (min. 32 characters).
      N8N_API_KEY: ci-smoke-test-key-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Prepare database
        run: |
          npx prisma migrate deploy
          npx prisma db seed
      - name: Start the standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          nohup node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:3000/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Smoke test pages and API
        run: |
          set -u
          check() { # check <expected-status> <path> [curl args...]
            want=$1; path=$2; shift 2
            got=$(curl -s -o /dev/null -w '%{http_code}' "$@" "http://localhost:3000$path")
            if [ "$got" = "$want" ]; then echo "ok   $got $path"; else echo "FAIL $got (want $want) $path"; fail=1; fi
          }
          fail=0
          check 200 /api/health
          check 307 /
          check 200 /bg
          check 200 /en
          check 200 /en/treatments
          check 200 /bg/benefits
          check 200 /en/book
          check 200 /en/login
          check 307 /admin                       # not signed in → login
          check 401 /api/n8n/procedures          # no key
          check 401 /api/n8n/procedures -H "Authorization: Bearer wrong-key-wrong-key-wrong-key-123"
          check 200 /api/n8n/procedures -H "Authorization: Bearer $N8N_API_KEY"
          check 200 /api/n8n/therapists -H "Authorization: Bearer $N8N_API_KEY"
          curl -fs -H "Authorization: Bearer $N8N_API_KEY" http://localhost:3000/api/n8n/procedures | grep -q '"slug"' || { echo "FAIL procedures JSON has no procedures"; fail=1; }
          exit $fail
      - name: Server log
        if: always()
        run: cat server.log || true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: false
          tags: velora:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
